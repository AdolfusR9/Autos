<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tesla 3D en la Web</title>
    <style>
        /* Quitamos márgenes y hacemos que el lienzo ocupe toda la pantalla */
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
        
        /* Texto superpuesto */
        #instrucciones {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            pointer-events: none; /* Para que no estorbe al hacer clic */
        }
    </style>
</head>
<body>
    <div id="instrucciones">Arrastra para rotar | Usa la rueda para hacer zoom</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. ESCENA Y CÁMARA
        const scene = new THREE.Scene();
        // Un poco de niebla oscura al fondo para dar profundidad
        scene.fog = new THREE.FogExp2(0x111111, 0.03); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 3, 7); // Alejamos un poco la cámara inicial

        // 2. RENDERIZADOR (El motor gráfico)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Para pantallas de alta definición (celulares/Macs)
        document.body.appendChild(renderer.domElement);

        // 3. LUCES (Estilo Showroom Premium)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // Luz azulada de rebote para dar estilo dramático
        const pointLight = new THREE.PointLight(0x44aaff, 10, 20);
        pointLight.position.set(-5, 2, -5);
        scene.add(pointLight);

        // 4. CONSTRUYENDO EL VEHÍCULO
        const carGroup = new THREE.Group();

        // Material metálico brillante
        const metalMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa, 
            metalness: 0.9, 
            roughness: 0.2 
        });

        // Chasis (Caja base)
        const baseGeometry = new THREE.BoxGeometry(4.5, 0.8, 2);
        const base = new THREE.Mesh(baseGeometry, metalMaterial);
        base.position.y = 0.8;
        carGroup.add(base);

        // Cabina angular (Cilindro modificado)
        const roofGeometry = new THREE.CylinderGeometry(0, 1.5, 1.2, 4);
        const roof = new THREE.Mesh(roofGeometry, metalMaterial);
        roof.rotation.y = Math.PI / 4; 
        roof.scale.set(1.6, 1, 0.8);
        roof.position.set(-0.3, 1.8, 0);
        carGroup.add(roof);

        // Ruedas
        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 32);

        function createWheel(x, z) {
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.x = Math.PI / 2; // Acostar el cilindro
            wheel.position.set(x, 0.5, z);
            carGroup.add(wheel);
        }

        // Posicionar las 4 ruedas
        createWheel(1.4, 1.1);   
        createWheel(1.4, -1.1);  
        createWheel(-1.4, 1.1);  
        createWheel(-1.4, -1.1); 

        scene.add(carGroup);

        // 5. SUELO DEL ESCENARIO
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222, 
            metalness: 0.3, 
            roughness: 0.8 
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2; // Acostar el plano
        scene.add(floor);

        // 6. CONTROLES DEL USUARIO
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Inercia fluida
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Bloquea la cámara para que no pase por debajo del suelo

        // 7. BUCLE DE ANIMACIÓN
        function animate() {
            requestAnimationFrame(animate);
            
            // Hacemos que el auto rote lentamente en su propio eje
            carGroup.rotation.y -= 0.003; 
            
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // 8. AJUSTE DE PANTALLA
        // Si el usuario cambia el tamaño de la ventana, el 3D se ajusta automáticamente
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
