<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurador Tesla Model 3</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: "Courier New", monospace; }
        
        /* Contenedor principal para el 3D */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Panel de configuración superpuesto */
        #config-panel {
            position: absolute;
            top: 80px; /* Debajo de la barra de navegación */
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            margin: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="w3-top" style="z-index: 20;">
        <div class="w3-bar w3-black w3-opacity-min w3-padding">
            <a href="index.html" class="w3-bar-item w3-button w3-xlarge">Adolfus</a>
            <a href="nosotros.html" class="w3-bar-item w3-button w3-xlarge">Nosotros</a>
            <a href="contacto.html" class="w3-bar-item w3-button w3-xlarge">Energia</a>
        </div>
    </div>

    <div id="config-panel">
        <h3>Personaliza tu Tesla</h3>
        <p>Elige tu pintura:</p>
        <div class="color-btn" style="background-color: #aaaaaa;" onclick="cambiarColor(0xaaaaaa)"></div> <div class="color-btn" style="background-color: #aa0000;" onclick="cambiarColor(0xaa0000)"></div> <div class="color-btn" style="background-color: #0000aa;" onclick="cambiarColor(0x000033)"></div> <div class="color-btn" style="background-color: #111111;" onclick="cambiarColor(0x111111)"></div> <br><br>
        <button class="w3-button w3-red w3-round" onclick="alert('¡Has guardado tu configuración!')">Guardar Configuración</button>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Variables globales para poder cambiar el color desde los botones HTML
        let materialCarroceria;

        // Configuración básica
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 3, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Luces (Estilo Showroom)
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // Material principal que cambiaremos de color
        materialCarroceria = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa, // Plata por defecto
            metalness: 0.8, 
            roughness: 0.2 
        });

        // Construcción del auto (Mismo código de geometría que hicimos antes)
        const carGroup = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.8, 2), materialCarroceria);
        base.position.y = 0.8;
        carGroup.add(base);

        const roof = new THREE.Mesh(new THREE.CylinderGeometry(0, 1.5, 1.2, 4), materialCarroceria);
        roof.rotation.y = Math.PI / 4; 
        roof.scale.set(1.6, 1, 0.8);
        roof.position.set(-0.3, 1.8, 0);
        carGroup.add(roof);

        // Ruedas negras
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 32);
        function createWheel(x, z) {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.x = Math.PI / 2; w.position.set(x, 0.5, z); carGroup.add(w);
        }
        createWheel(1.4, 1.1); createWheel(1.4, -1.1); createWheel(-1.4, 1.1); createWheel(-1.4, -1.1); 

        scene.add(carGroup);

        // Controles de cámara
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Función que conecta los botones HTML con Three.js
        window.cambiarColor = function(colorHexadecimal) {
            materialCarroceria.color.setHex(colorHexadecimal);
        };

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
