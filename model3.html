<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurador Tesla Model 3</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #eeeeee; color: white; font-family: "Courier New", monospace; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }

        /* Panel de configuración */
        #config-panel {
            position: absolute; top: 70px; left: 20px; z-index: 10;
            background: rgba(15, 15, 15, 0.9); padding: 20px;
            border-radius: 12px; border: 1px solid #333;
            width: 340px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2, h3, p { margin-top: 0; margin-bottom: 10px; }
        
        /*  PRECIO DINÁMICO */
        #precio-total {
            font-size: 28px; font-weight: bold; color: #4CAF50;
            margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px;
        }

        .opcion-grupo { margin-bottom: 20px; }

        /*  Estado activo en botones */
        .color-btn {
            width: 35px; height: 35px; border-radius: 50%;
            border: 2px solid #555; cursor: pointer; margin: 0 5px 5px 0;
            display: inline-block; transition: 0.2s;
        }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.activo { border: 3px solid #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.8); }

        .btn-opcion {
            background-color: #333; color: white; border: 1px solid #555;
            padding: 8px 12px; margin: 2px; cursor: pointer; border-radius: 5px; transition: 0.2s;
        }
        .btn-opcion.activo { background-color: #fff; color: #000; font-weight: bold; }
        #resumen-caja {
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;
            font-size: 12px; margin-bottom: 15px; color: #ccc;
        }
        #resumen-caja ul { padding-left: 20px; margin: 5px 0 0 0; }
    </style>
</head>
<body>

    <div class="w3-top" style="z-index: 20;">
        <div class="w3-bar w3-black w3-opacity-min w3-padding">
            <a href="index.html" class="w3-bar-item w3-button w3-xlarge">Adolfus</a>
            <a href="nosotros.html" class="w3-bar-item w3-button w3-xlarge">Nosotros</a>
        </div>
    </div>

    <div id="config-panel">
        <h2>Model 3</h2>
        <div id="precio-total">$880,000 MXN</div> <div class="opcion-grupo">
            <p><strong>Pintura Exterior</strong></p>
            <div class="color-btn activo" style="background-color: #aaaaaa;" onclick="cambiarPintura(0xaaaaaa, 'Plata Escarlata', 0, this)"></div>
            <div class="color-btn" style="background-color: #ffffff;" onclick="cambiarPintura(0xffffff, 'Blanco Perla', 0, this)"></div>
            <div class="color-btn" style="background-color: #8b0000;" onclick="cambiarPintura(0x8b0000, 'Ultra Rojo', 40000, this)"></div>
            <div class="color-btn" style="background-color: #000033;" onclick="cambiarPintura(0x000033, 'Azul Profundo', 40000, this)"></div>
            <div class="color-btn" style="background-color: #111111;" onclick="cambiarPintura(0x111111, 'Negro Sólido', 0, this)"></div>
        </div>

        <div class="opcion-grupo">
            <p><strong>Diseño de Rines</strong></p>
            <button class="btn-opcion activo" id="btn-rin-std" onclick="cambiarRines('estandar', 0)">Estándar 18"</button>
            <button class="btn-opcion" id="btn-rin-spt" onclick="cambiarRines('sport', 35000)">Sport Negros 19" (+$35k)</button>
        </div>

        <div class="opcion-grupo">
            <p><strong>Interior</strong></p>
            <button class="btn-opcion activo" id="btn-int-negro" onclick="cambiarInterior(0x111111, 'Negro Total', 0)">Negro</button>
            <button class="btn-opcion" id="btn-int-blanco" onclick="cambiarInterior(0xffffff, 'Blanco Premium', 21000)">Blanco (+$21k)</button>
        </div>

        <div class="opcion-grupo">
            <p><strong>Software</strong></p>
            <label style="cursor: pointer;">
                <input type="checkbox" id="chk-autopilot" onchange="toggleAutopilot(this)" style="margin-right: 8px;">
                Autopilot Avanzado (+$177,000)
            </label>
        </div>

        <div id="resumen-caja">
            <strong>Resumen de tu configuración:</strong>
            <ul id="lista-resumen">
                <li>Model 3 Base</li>
                <li id="res-pintura">Pintura: Plata Escarlata</li>
                <li id="res-rines">Rines: Estándar 18"</li>
                <li id="res-interior">Interior: Negro Total</li>
                <li id="res-autopilot" style="display: none;">Incluye: Autopilot Avanzado</li>
            </ul>
        </div>

        <button class="w3-button w3-red w3-round w3-block" onclick="alert('¡Orden enviada a producción!')">Realizar Pedido</button>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // ================= ESTADO DE LA APLICACIÓN (LÓGICA DE PRECIOS) =================
        const estado = {
            precioBase: 880000,
            precioPintura: 0,
            precioRines: 0,
            precioInterior: 0,
            precioAutopilot: 0
        };

        // Formateador para pesos mexicanos (MXN)
        const formateadorMoneda = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });

        function actualizarPrecioYResumen() {
            // Calcular total
            const total = estado.precioBase + estado.precioPintura + estado.precioRines + estado.precioInterior + estado.precioAutopilot;
            document.getElementById('precio-total').innerText = formateadorMoneda.format(total);
        }

        // Listas para guardar las piezas 3D que modificaremos
        const materialesPintura = []; 
        const materialesInterior = [];
        const materialesRines = [];

        // ================= CONFIGURACIÓN 3D =================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee); // Fondo de estudio claro

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 2, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        //  REALISMO: Entorno de reflejos (HDRI)
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); 
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 5); 
        spotLight.position.set(2, 8, 5);
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 2048;
        spotLight.shadow.mapSize.height = 2048;
        scene.add(spotLight);

        //  REALISMO: Plano de sombras invisible 
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        // ShadowMaterial hace que el piso sea invisible pero SÍ dibuja la sombra del auto
        const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.5 }); 
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // ================= CARGAR EL AUTO =================
        const loader = new GLTFLoader();
        let modeloAuto;

        loader.load('tesla3.glb', function (gltf) {
            modeloAuto = gltf.scene;
            modeloAuto.position.y = 0.8; 

            modeloAuto.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    
                    let nombreMat = child.material.name.toLowerCase();
                    
                    // Atrapar Pintura
                    if (nombreMat.includes('primary') || nombreMat.includes('chassis')) {
                        child.material = child.material.clone(); 
                        child.material.metalness = 0.8; 
                        child.material.roughness = 0.2; 
                        child.material.clearcoat = 1.0; 
                        child.material.map = null; 
                        materialesPintura.push(child.material);
                    }
                    
                    //  Atrapar Interior 
                    if (nombreMat.includes('seat') || nombreMat.includes('leather') || nombreMat.includes('putih')) {
                        child.material = child.material.clone();
                        child.material.color.setHex(0x111111);
                        materialesInterior.push(child.material);
                    }

                    // Atrapar Rines 
                    if (nombreMat.includes('hub_')) {
                        child.material = child.material.clone();
                        materialesRines.push(child.material);
                    }
                }
            });

            scene.add(modeloAuto);
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 

        // ================= FUNCIONES INTERACTIVAS (CONECTADAS AL HTML) =================
        
        window.cambiarPintura = function(colorHex, nombreColor, precioAdicional, botonElemento) {
            // Actualizar 3D
            materialesPintura.forEach(mat => { mat.color.setHex(colorHex); mat.needsUpdate = true; });
            
            // UI: Quitar clase activa a todos y ponersela al seleccionado
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('activo'));
            botonElemento.classList.add('activo');
            
            // Estado y Resumen
            estado.precioPintura = precioAdicional;
            document.getElementById('res-pintura').innerText = `Pintura: ${nombreColor}`;
            actualizarPrecioYResumen();
        };

        window.cambiarRines = function(tipo, precioAdicional) {
            let colorNuevo = tipo === 'estandar' ? 0xcccccc : 0x111111;
            let roughnessNuevo = tipo === 'estandar' ? 0.4 : 0.8; 

            materialesRines.forEach(mat => { 
                mat.color.setHex(colorNuevo); 
                mat.roughness = roughnessNuevo;
                mat.needsUpdate = true; 
            });
            // UI de botones
            document.getElementById('btn-rin-std').classList.toggle('activo', tipo === 'estandar');
            document.getElementById('btn-rin-spt').classList.toggle('activo', tipo === 'sport');
            // Estado
            estado.precioRines = precioAdicional;
            document.getElementById('res-rines').innerText = tipo === 'estandar' ? 'Rines: Estándar 18"' : 'Rines: Sport Negros 19"';
            actualizarPrecioYResumen();
        };
        window.cambiarInterior = function(colorHex, nombre, precioAdicional) {
            materialesInterior.forEach(mat => { mat.color.setHex(colorHex); mat.needsUpdate = true; });
            
            document.getElementById('btn-int-negro').classList.toggle('activo', colorHex === 0x111111);
            document.getElementById('btn-int-blanco').classList.toggle('activo', colorHex === 0xffffff);

            estado.precioInterior = precioAdicional;
            document.getElementById('res-interior').innerText = `Interior: ${nombre}`;
            actualizarPrecioYResumen();
        };

        window.toggleAutopilot = function(checkbox) {
            estado.precioAutopilot = checkbox.checked ? 177000 : 0;
            document.getElementById('res-autopilot').style.display = checkbox.checked ? 'list-item' : 'none';
            actualizarPrecioYResumen();
        };

        function animate() {
            requestAnimationFrame(animate);
            if(modeloAuto) modeloAuto.rotation.y += 0.001;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
